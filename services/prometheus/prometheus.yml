global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # In-network target when profile `serving` is up. For host-only dev: host.docker.internal:8082
  - job_name: lichess-serving
    metrics_path: /metrics
    static_configs:
      - targets: ["lichess-serving:8082"]
