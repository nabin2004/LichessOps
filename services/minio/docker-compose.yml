services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lichess-minio
    profiles: [core]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - lichess-net

  minio_setup:
    image: minio/mc:latest
    container_name: lichess-minio-setup
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}" &&
        mc mb --ignore-existing local/lichess-raw &&
        mc mb --ignore-existing local/lichess-processed &&
        mc mb --ignore-existing local/mlflow-artifacts &&
        mc anonymous set download local/mlflow-artifacts
    networks:
      - lichess-net
    restart: "no"
