# Apache Spark standalone cluster (profile `pipeline`) — master UI on host port 8081.
services:
  spark:
    image: apache/spark:4.1.2-python3
    container_name: lichess-spark-master
    profiles: [pipeline]
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_ENDPOINT_URL=http://minio:9000
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ../..:/workspace
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - lichess-net

  spark-worker:
    image: apache/spark:4.1.2-python3
    container_name: lichess-spark-worker
    profiles: [pipeline]
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark:7077
      - --memory
      - 1G
      - --cores
      - "1"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_ENDPOINT_URL=http://minio:9000
    volumes:
      - ../..:/workspace
    depends_on:
      spark:
        condition: service_healthy
    networks:
      - lichess-net

  spark-submit:
    image: apache/spark:4.1.2-python3
    profiles: [tools]
    entrypoint: ["/opt/spark/bin/spark-submit"]
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_ENDPOINT_URL=http://minio:9000
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    networks:
      - lichess-net
