# Feast OSS feature server stack (optional profile `feast`).
# Uses the Python feature server with Redis as the online store.

services:
  feast-redis:
    image: redis:7-alpine
    container_name: lichess-feast-redis
    profiles: [feast]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lichess-net

  feast-feature-server:
    image: feastdev/feature-server:${FEAST_VERSION:-0.46.0}
    container_name: lichess-feast-feature-server
    profiles: [feast]
    restart: unless-stopped
    depends_on:
      feast-redis:
        condition: service_healthy
    ports:
      - "6566:6566"
    environment:
      FEAST_REPO_PATH: /feast
    volumes:
      - ${FEAST_REPO_PATH:-./packages/lichess_features/feast_repo}:/feast
    working_dir: /feast
    command: ["feast", "serve", "--host", "0.0.0.0", "--port", "6566"]
    networks:
      - lichess-net

  feast-jupyter:
    image: jupyter/base-notebook:python-3.11
    container_name: lichess-feast-jupyter
    profiles: [feast]
    restart: unless-stopped
    depends_on:
      feast-redis:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-feast}
    volumes:
      - ${FEAST_REPO_PATH:-./packages/lichess_features/feast_repo}:/feast
    working_dir: /feast
    command:
      - "bash"
      - "-lc"
      - "pip install --no-cache-dir feast==${FEAST_VERSION:-0.46.0} && jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.token=${JUPYTER_TOKEN:-feast}"
    networks:
      - lichess-net

  feast-cli:
    image: feastdev/feature-server:${FEAST_VERSION:-0.46.0}
    container_name: lichess-feast-cli
    profiles: [feast]
    working_dir: /feast
    entrypoint: ["feast"]
    volumes:
      - ${FEAST_REPO_PATH:-./packages/lichess_features/feast_repo}:/feast
    networks:
      - lichess-net
