[project]
name = "lichess-features"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nabin Oli", email = "olinabin2004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lichess-data",
    "lichess-libs",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
lichess-features = "lichess_features:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
lichess-data = { workspace = true }
lichess-libs = { workspace = true }
