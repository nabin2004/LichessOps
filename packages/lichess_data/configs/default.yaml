download:
  base_url: https://database.lichess.org
  category: standard
  output_subpath: raw/pgn
  chunk_size_bytes: 8388608
  verify_checksum: true
  skip_existing: true

storage:
  backend: minio
  raw_bucket: lichess-raw
  processed_bucket: lichess-processed
  raw_prefix: pgn
  columnstore:
    host: localhost
    port: 3307
    database: lichess_analytics
    user: lichess
    password: Lichess_Analytics1!

extract:
  # Input is passed on the CLI; output defaults under this artifact subpath.
  # Example input: artifacts/lichess_data/raw/pgn/lichess_db_standard_rated_2013-01.pgn.zst
  output_subpath: processed
  batch_size: 5000

preprocessing:
  output_subpath: preprocessed

great_expectations:
  context_root: great_expectations
  processed_suite: processed_minimal
  preprocessed_suite: preprocessed_minimal
