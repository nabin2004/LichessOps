download:
  base_url: https://database.lichess.org
  category: standard
  output_subpath: raw/pgn
  chunk_size_bytes: 8388608
  verify_checksum: true
  skip_existing: true

extract:
  # Input/output paths are typically set per run or derived from a downloaded shard.
  # Example: artifacts/lichess_data/raw/pgn/lichess_db_standard_rated_2013-01.pgn.zst
  batch_size: 5000
