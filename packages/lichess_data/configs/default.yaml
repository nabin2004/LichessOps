download:
  base_url: https://database.lichess.org
  category: standard
  output_subpath: raw/pgn
  chunk_size_bytes: 8388608
  verify_checksum: true
  skip_existing: true

extract:
  # Input is passed on the CLI; output defaults under this artifact subpath.
  # Example input: artifacts/lichess_data/raw/pgn/lichess_db_standard_rated_2013-01.pgn.zst
  output_subpath: processed
  batch_size: 5000
