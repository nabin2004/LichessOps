[project]
name = "lichess-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nabin Oli", email = "olinabin2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35.0",
    "chess>=1.11.2",
    "duckdb>=1.1.0",
    "great-expectations>=0.18.19",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.3",
    "zstandard>=0.23.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "moto[s3]>=5.0.0"]
spark = ["pyspark>=4.0.0"]

[project.scripts]
lichess-data = "lichess_data:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
