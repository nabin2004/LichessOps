[project]
name = "lichess-serving"
version = "0.1.0"
description = "FastAPI inference service for Lichess outcome prediction"
readme = "README.md"
authors = [
    { name = "Nabin Oli", email = "olinabin2004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "lichess-libs",
    "lichess-models",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "pydantic>=2.10.0",
    "scikit-learn>=1.8.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
lichess-serving = "lichess_serving:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
lichess-models = { workspace = true }
lichess-libs = { workspace = true }
