[project]
name = "lichess"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "chess>=1.11.2",
    "matplotlib>=3.10.9",
    "missingno>=0.5.2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "lichess-data",
    "lichess-features",
    "lichess-models",
    "lichess-serving",
]

[tool.uv.sources]
lichess-data = { workspace = true }
lichess-features = { workspace = true }
lichess-models = { workspace = true }
lichess-serving = { workspace = true }


[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "libs"]